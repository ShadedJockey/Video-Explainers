# Every image used in the video. `tools/fetch_images.py` downloads them and
# records licence/credit metadata into build/image_credits.json (→ sources.md).
#
#   source: commons  → Wikimedia Commons file (public domain / CC licences)
#   source: enwiki   → English-Wikipedia-hosted file (non-free, low-res fair-use images)
#   source: ghibli   → Studio Ghibli's official free-to-use stills (ghibli.jp/info/013344)
#   kind:   pd (public-domain art → assets/public_domain/)  |  still (copyrighted → assets/stills/)
#
# To replace any image with a better one, drop a file with the same id into
# assets/stills/ or assets/public_domain/ (e.g. assets/stills/link.png) and set
# `source: local`.

