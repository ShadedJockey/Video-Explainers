# ─────────────────────────────────────────────────────────────
#  Storyboard data: the timeline the renderer builds.
#  Human-readable version: script/storyboard.md
#
#  Times are tied to narration lines (see tools/render.py header):
#    s3.2 = section 3 line 2 starts · s3.2@0.5 = halfway through it · s3.2e = it ends
#  Positions x, y are the centre of the item as a fraction of the frame;
#  h = height as a fraction of frame height. img can be a list (first one found is used).
#  enter: pop | slide_left | slide_right | slide_up | slide_down | drop | fade
#  transition (into a scene): tear (paper tear) | flip (quick tear) | cut
# ─────────────────────────────────────────────────────────────

# ════════ 1 · HOOK ══════════════════════════════════════════
- id: hook
  palette: hyrule
  zoom: 0.05
  elements:
    - {type: path, points: [[0.05, 0.86], [0.22, 0.70], [0.42, 0.84], [0.62, 0.66], [0.80, 0.80], [0.96, 0.64]], stops: [1, 3, 5], at: s1.2-0.2, dur: 3.6}
    - {type: cutout, img: [link_botw, link], x: 0.5, y: 0.60, h: 0.64, enter: pop, at: 0.3,
       keys: [{at: s1.2, x: 0.12, h: 0.5, y: 0.44}]}
    - {type: caption, text: "Why does Link\nfeel so familiar?", style: title, size: 72, x: 0.5, y: 0.13, at: s1.1@0.35, until: s1.2-0.1, rot: -2}
    - {type: caption, text: "LEAVE HOME", style: stamp, size: 46, x: 0.33, y: 0.58, rot: -8, at: s1.2@0.15, until: s1.3}
    - {type: caption, text: "FACE PROBLEMS", style: stamp, size: 46, x: 0.60, y: 0.50, rot: 6, at: s1.2@0.45, until: s1.3}
    - {type: caption, text: "KEEP GOING", style: stamp, size: 46, x: 0.86, y: 0.48, rot: -5, at: s1.2@0.78, until: s1.3}
    - {type: cutout, img: gilgamesh, x: 0.80, y: 0.36, h: 0.56, rot: 4, enter: slide_right, at: s1.3}
    - {type: caption, text: "c. 1800 BCE", style: type, size: 30, x: 0.80, y: 0.70, rot: 3, at: s1.3@0.5}

