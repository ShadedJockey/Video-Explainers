# Draft 4: "The Hero With Infinite Faces", 3-minute TikTok cut (1080×1920).
# Script: draft4/narration.md · plan: draft4/PLAN.md · renderer: tools/render_v4.py
#   ./render.sh v4-voice → v4-preview → v4-final

output:
  final:   {width: 1080, height: 1920, fps: 30, crf: 23, preset: slow,     file: final/hero_infinite_faces_v4_vertical.mp4}
  preview: {width: 540,  height: 960,  fps: 15, crf: 28, preset: veryfast, file: draft4/build/preview_540x960.mp4}

series_name: "SERIES_NAME"        # ← your channel name (header tag + end card)

voice:
  engine: pocket                  # Kyutai Pocket TTS (CC BY 4.0), run from .tts/pocket (./render.sh v4-setup)
  pocket_voice: anna              # VCTK speaker p228 (CC BY 4.0)
  lead_in: 2.4                    # title card before the first line
  gap_between_lines: 0.42
  gap_between_sections: 0.95
  tail: 3.6                       # end card
  pronunciations:                 # spoken spelling for the TTS only (screen text unchanged)
    "Nausicaä": "Nowsika"
    "Deutsch": "Doytch"
    "Mesoamerica": "Meso-America"

music:
  file: assets/music.mp3          # your bed; if missing, the generated drone is used (with the same envelope)
  level_db: -24
  duck_db: 6
  envelope: {1: 0.35, 2: 0.45, 3: 0.6, 4: 0.55, 5: 0.75, 6: 0.6, 7: 0.9}
foley:
  paper_db: -31                   # each picture landing
loudness: {integrated_lufs: -15, true_peak_db: -1.2, sample_rate: 48000}

layout:                           # px at 1080×1920; TikTok covers top 220, bottom 480, right 140
  safe_top: 220
  header_y: [230, 290]
  text_y: [300, 900]
  text_x: [60, 940]
  max_strips: 6
  stage: [930, 1430]              # pictures, panels and maps for the current line
  safe_bottom: 1440
  safe_right: 140
  header_fade_px: 26

fonts:
  body:         assets/fonts/EBGaramond-Variable.ttf
  body_italic:  assets/fonts/EBGaramond-Italic-Variable.ttf
  title:        assets/fonts/InstrumentSerif-Regular.ttf
  title_italic: assets/fonts/InstrumentSerif-Italic.ttf

colors:
  strip: "#f6f1e6"                # paper strips
  ink: "#141110"
  label_bg: "#141110"             # museum labels under pictures
  label_ink: "#f3ead8"
  accent: "#c8553d"               # route line, strike-throughs, stamps (brick red, not gold)
  background: "#1a1716"

text: {size_px: 48, strip_h_em: 1.42, gap_px: 8, para_gap_px: 16, pad_x_px: 28}

motion: {piece_slide_s: [0.25, 0.5], scroll_s: 0.4, section_change_s: 0.6, rotation_deg: 2.5}

collage:                          # quiet background collage behind the stage
  seed: 41
  size_px: [280, 640]
  interval_s: 0.75
  dim: 0.52                       # background brightness (the stage and text sit on top)
  pools: [draft3/collage_credits.json, draft2/collage_credits.json]
  exclude: [draft3/collage_exclude.txt, draft2/collage_exclude.txt, draft4/collage_exclude.txt]
  drop_themes: [esoteric, scripture, cosmos, stars, labyrinth, emblem, infinity, wisdom, k, guts, chief, shadow, stark, prologue, fire, cycle]
  section_themes:
    1: [faces, portrait, costume, map, gilgamesh, mythmaker, ruins]
    2: [faces, portrait, hands, tradition]
    3: [wings, eyes, haeckel, library, microscope]
    4: [nausicaa, haeckel, soil, microscope, rational]
    5: [dragon, explain, rational, frontier, library]
    6: [ruins, walls, tradition, mythmaker, gilgamesh]
    7: [faces, portrait, frontier, infinite]
  # religious, heavenly or occult subjects are filtered by title as well (see tools/render_v4.py RELIGIOUS)
